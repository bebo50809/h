<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bypass Blocked Sites</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    input, select, button { padding: 0.5rem; margin: 0.5rem 0; width: 100%; max-width: 500px; }
  </style>
</head>
<body>
  <h1>Ahmed Hussein Unlock tool</h1>
  <input type="text" id="url" placeholder="Enter blocked URL (e.g., https://example.com)">
  <select id="method">
    <option value="translate">Method Alpha</option>
    <option value="weblight">Light trick</option>
    <option value="wayback">Wayback Machine</option>
  </select>
  <button onclick="redirect()">Open</button>

  <script>
    function redirect() {
      const url = document.getElementById("url").value.trim();
      const method = document.getElementById("method").value;
      if (!url) return alert("Please enter a URL.");
      const encoded = encodeURIComponent(url);
      let redirectUrl = "";

      switch (method) {
        case "translate":
          redirectUrl = `https://translate.google.com/translate?tl=en&u=${encoded}`;
          break;
        case "weblight":
          redirectUrl = `http://googleweblight.com/i?u=${encoded}`;
          break;
        case "wayback":
          redirectUrl = `https://web.archive.org/web/*/${url}`;
          break;
      }

      window.location.href = redirectUrl;
    }
  </script>
</body>
</html>
